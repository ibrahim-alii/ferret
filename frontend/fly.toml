# Fly.io config for the Ferret Express frontend.
# Deploy from the REPO ROOT (the Dockerfile copies frontend/*):
#   fly deploy --config frontend/fly.toml
# App names are globally unique on Fly — rename "ferret-web" if it's taken.
app = "ferret-web"
primary_region = "iad"

[build]
  dockerfile = "frontend/Dockerfile"

[env]
  PORT = "3000"
  # Full public origin of the deployed backend (injected into the browser via
  # /config.js). Must match the backend's app URL.
  BACKEND_URL = "https://ferret-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
