<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferret — Research Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar" class="sidebar" aria-label="Chat history">
    <button id="new-chat-btn" class="new-chat-btn" aria-label="Start a new chat">
      <span class="new-chat-icon" aria-hidden="true">＋</span> New chat
    </button>
    <div class="sidebar-head">
      <span class="sidebar-title">History</span>
    </div>
    <ul id="session-list" class="session-list" aria-live="polite"></ul>
  </aside>

  <div id="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo">
          <span class="logo-mark">⬡</span>
          <span class="logo-text">Ferret</span>
        </div>
        <p class="logo-sub">Research Intelligence</p>
      </div>
      <div id="mode-badge" class="mode-badge" hidden aria-live="polite">
        <span class="mode-badge-dot" aria-hidden="true"></span>
        <span id="mode-badge-label" class="mode-badge-label"></span>
      </div>
    </header>

    <section id="arxiv-section" class="arxiv-section" hidden aria-label="Paper ingestion">
      <div class="arxiv-row">
        <label for="arxiv-input" class="sr-only">arXiv ID</label>
        <input
          id="arxiv-input"
          type="text"
          placeholder="arXiv ID — e.g. 2301.00001"
          autocomplete="off"
          spellcheck="false"
          aria-label="arXiv paper ID"
        />
        <button id="arxiv-btn" aria-label="Ingest paper">Ingest</button>
      </div>
      <p id="ingestion-status" class="status-line" aria-live="polite"></p>
    </section>

    <main class="chat-area" aria-label="Conversation">
      <div id="mode-picker" class="mode-picker" aria-label="Choose a research mode">
        <button id="pick-ask" class="mode-card">
          <span class="mode-card-icon" aria-hidden="true">◎</span>
          <span class="mode-card-title">Ask</span>
          <span class="mode-card-desc">Search across the whole corpus. It grows as you add papers.</span>
        </button>
        <button id="pick-deep" class="mode-card">
          <span class="mode-card-icon" aria-hidden="true">◈</span>
          <span class="mode-card-title">Deep Dive</span>
          <span class="mode-card-desc">Ground every answer in a single paper you choose.</span>
        </button>
      </div>

      <div
        id="chat-list"
        class="chat-list"
        role="log"
        aria-label="Messages"
        aria-live="polite"
      ></div>

      <div class="input-row">
        <label for="chat-input" class="sr-only">Message</label>
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Ask a question…"
          disabled
          aria-label="Chat message"
        ></textarea>
        <button id="chat-btn" disabled aria-label="Send message">
          <span aria-hidden="true">↑</span>
        </button>
      </div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
