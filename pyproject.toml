[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferret"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",

    # LangGraph / LangChain
    "langgraph>=0.2",
    "langchain-core>=0.2",

    # Vector store
    "qdrant-client[fastembed]>=1.9",

    # Embeddings (reranking is Jina via the httpx REST client above)
    "openai>=1.0",
    "google-genai>=1.0",

    # LLM
    "groq>=0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",

    # PDF parsing
    "pymupdf>=1.24",

    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.2",

    # Chunking / tokenisation
    "tiktoken>=0.7",

    # CLI
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
ferret = "backend.cli.main:app"

[project.optional-dependencies]
eval = [
    "ragas>=0.1",
    "ranx>=0.3",
    "datasets>=2.19",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx",          # already a runtime dep, listed for clarity in dev installs
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits real external APIs (deselected by default)",
    "eval: full RAG eval suite (deselected by default)",
]
addopts = "-m 'not integration and not eval'"
testpaths = ["tests"]
